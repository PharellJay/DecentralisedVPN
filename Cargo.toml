[package]
name = "dvpn"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Decentralised peer-to-peer VPN"

[workspace]
# The desktop app. Plain `cargo build` / `cargo test` here build only dvpn itself, so
# working on it doesn't need the app's WebKitGTK headers.
members = ["gui"]

[[bin]]
name = "dvpn"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
crossterm = { version = "0.28.1", features = ["event-stream"] }
directories = "6.0.0"
futures = "0.3.34"
ipnet = "2.12.2"
libp2p = { version = "0.57.1", features = [
    "tokio",
    "tcp",
    "quic",
    "noise",
    "yamux",
    "kad",
    "mdns",
    "identify",
    "ping",
    "autonat",
    "dcutr",
    "relay",
    "macros",
    "ed25519",
] }
libp2p-stream = "0.5.0-alpha"
postcard = { version = "1.1.3", features = ["use-std"] }
rand = "0.10.3"
ratatui = "0.29.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
snow = "0.10.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tracing = "0.1.44"
tun-rs = { version = "2.8.16", features = ["async"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
zeroize = "1.9.1"

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["test-util"] }

[package.metadata.deb]
maintainer = "Pharell Jay Jeyakumar <pharelljeyakumar1010@gmail.com>"
copyright = "2026, Pharell Jay Jeyakumar"
license-file = ["LICENSE", "0"]
section = "net"
priority = "optional"
extended-description = """\
A peer-to-peer VPN with no central server. Your traffic leaves the internet from \
another peer's IP address, routed through two hops so no single peer sees both who \
you are and where you're going. Using it means lending your own connection as an exit \
for others in return.

This package runs dvpn as a systemd service, idle until it is asked to lend or \
connect, or set to lend from boot. Members of the dvpn \
group control it with the `dvpn` dashboard or `dvpn ctl`, without sudo."""
depends = "$auto, iproute2, nftables, systemd"
recommends = "systemd-resolved"
maintainer-scripts = "packaging/debian/"
assets = [
    ["target/release/dvpn", "usr/bin/", "755"],
    ["packaging/default", "etc/default/dvpn", "644"],
    ["scripts/exit-teardown.sh", "usr/share/dvpn/", "755"],
    ["README.md", "usr/share/doc/dvpn/", "644"],
    ["docs/DESIGN.md", "usr/share/doc/dvpn/", "644"],
]

[package.metadata.deb.systemd-units]
unit-scripts = "packaging/"
enable = true
start = true
